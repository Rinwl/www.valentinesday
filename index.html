<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Введи пароль</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        input {
            padding: 10px;
            font-size: 18px;
            border: 2px solid pink;
            border-radius: 25px;
            text-align: center;
            background: linear-gradient(145deg, #ff9a9e, #fecfef);
            color: black;
            outline: none;
            box-shadow: 0 0 10px rgba(255, 192, 203, 0.7);
        }
        input::placeholder {
            color: rgba(0, 0, 0, 0.5);
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(145deg, #ff758c, #ff7eb3);
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 105, 135, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(255, 105, 135, 0.7);
        }
        #hidden-content {
            display: none;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="container" id="login-container">
        <h2>Введи пароль:</h2>
        <input type="password" id="password" placeholder="Введите пароль">
        <button onclick="checkPassword()">Підтвердити</button>
    </div>
    
    <div id="hidden-content">
        <canvas id="canvas"></canvas>
        <div class="text">Сашенька<br>З днем всх закоханих<br>На вихідних тебе чеає подарунок.<br>Люблю тебе</div>
        <iframe src="https://www.youtube.com/embed/iggmiF7DNoM?autoplay=1&loop=1&playlist=iggmiF7DNoM" allow="autoplay" style="display: none;"></iframe>
    </div>

    <script>
        function checkPassword() {
            const password = document.getElementById("password").value;
            if (password === "0508") {
                document.getElementById("login-container").style.display = "none";
                document.getElementById("hidden-content").style.display = "block";
                startAnimation();
            } else {
                alert("Неправильний пароль! Спробуй ще раз.");
            }
        }

        function startAnimation() {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const hearts = [];

            class Heart {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 20 + 10;
                    this.speedY = Math.random() * 2 + 1;
                    this.opacity = Math.random() * 0.5 + 0.5;
                    this.color = `rgba(255, ${Math.random() * 100 + 50}, ${Math.random() * 100 + 50}, ${this.opacity})`;
                }

                draw() {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.bezierCurveTo(this.x - this.size, this.y - this.size, this.x - this.size * 2, this.y + this.size, this.x, this.y + this.size * 2);
                    ctx.bezierCurveTo(this.x + this.size * 2, this.y + this.size, this.x + this.size, this.y - this.size, this.x, this.y);
                    ctx.fill();
                }

                update() {
                    this.y -= this.speedY;
                    if (this.y < -10) {
                        this.y = canvas.height + 10;
                        this.x = Math.random() * canvas.width;
                    }
                }
            }

            function createHearts() {
                for (let i = 0; i < 50; i++) {
                    hearts.push(new Heart());
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                hearts.forEach((heart) => {
                    heart.update();
                    heart.draw();
                });
                requestAnimationFrame(animate);
            }

            createHearts();
            animate();

            window.addEventListener("resize", () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }
    </script>
</body>
</html>
